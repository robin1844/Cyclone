<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Cyclone</title>
<style>
  :root {
    --bg:       #f4f6f9;
    --fg:       #111827;
    --muted:    #6b7280;
    --accent:   #1d4ed8;
    --accent-fg:#ffffff;
    --border:   #dde2ea;
    --card:     #ffffff;
    --shadow:   0 2px 6px rgba(0,0,0,.08);
    --focus:    #dc2626;
    --radius:   .65rem;
    --header-bg:#111827;
    --header-fg:#f1f5f9;
    --danger:   #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:       #0d1117;
      --fg:       #e6edf3;
      --muted:    #8b96a5;
      --accent:   #4493f8;
      --accent-fg:#040d21;
      --border:   #21262d;
      --card:     #161b22;
      --shadow:   0 2px 6px rgba(0,0,0,.45);
      --focus:    #f0b429;
      --header-bg:#010409;
      --header-fg:#e6edf3;
      --danger:   #ef4444;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 1.05rem;
    line-height: 1.65;
  }

  header {
    background: var(--header-bg);
    color: var(--header-fg);
    border-bottom: 3px solid var(--accent);
    padding: 1.4rem 1.5rem 1.2rem;
  }
  h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -.03em;
    margin: 0;
    color: var(--header-fg);
  }

  main { max-width: 32rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

  /* Big connect/stop button */
  #main-btn {
    font: inherit;
    font-weight: 800;
    font-size: 1.4rem;
    width: 100%;
    min-height: 4.5rem;
    padding: .8rem 1.5rem;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: var(--accent-fg);
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: opacity .15s, background .15s;
    margin-bottom: 1.5rem;
  }
  #main-btn.stop-mode { background: var(--danger); color: #fff; }
  #main-btn:hover:not(:disabled) { opacity: .85; }
  #main-btn:disabled { opacity: .38; cursor: default; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* RPM display */
  #rpm-display {
    text-align: center;
    margin: 1rem 0 2rem;
  }
  #rpm-display[hidden] { display: none; }
  #rpm-label {
    font-size: .8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
  }
  #rpm-value {
    font-size: 6rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -.04em;
  }

  /* Distance stats */
  #stats {
    margin: 1.5rem 0;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: .75rem 1rem;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: .6rem;
  }
  .stat-label {
    font-weight: 600;
    font-size: .95rem;
  }
  .stat-value {
    font-size: 1.3rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }

  /* Status */
  #status {
    font-size: .9rem;
    color: var(--muted);
    margin: 0 0 1rem;
    min-height: 1.4em;
  }

  /* Reset button */
  #reset-btn {
    font: inherit;
    font-weight: 600;
    font-size: .9rem;
    min-height: 2.8rem;
    padding: .55rem 1.2rem;
    border-radius: var(--radius);
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--muted);
    box-shadow: var(--shadow);
    cursor: pointer;
    margin-top: 2rem;
    width: 100%;
    transition: opacity .15s;
  }
  #reset-btn:hover { opacity: .75; }

  #unsupported { color: var(--danger); font-size: .9rem; margin: .5rem 0; }

  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>Cyclone</h1>
</header>

<main>
  <button id="main-btn">Connect</button>

  <p id="status" role="status" aria-live="polite" aria-atomic="true">Not connected. Tap Connect to start.</p>
  <p id="unsupported" hidden>This browser has no Bluetooth. Open this page in WebBLE.</p>

  <div id="rpm-display" hidden>
    <div id="rpm-label">Cadence (RPM)</div>
    <div id="rpm-value">0</div>
  </div>

  <div id="stats">
    <div class="stat-row">
      <span class="stat-label">Today</span>
      <span class="stat-value" id="stat-today">0.00 km</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">This week</span>
      <span class="stat-value" id="stat-week">0.00 km</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">This month</span>
      <span class="stat-value" id="stat-month">0.00 km</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">All time</span>
      <span class="stat-value" id="stat-alltime">0.00 km</span>
    </div>
  </div>

  <button id="reset-btn">Reset all distance data</button>
</main>

<!-- ARIA speech regions -->
<p id="spoken" class="vh" aria-live="assertive" aria-atomic="true"></p>

<script>
"use strict";
const FTMS = 0x1826, IBD = 0x2ad2;
const $ = id => document.getElementById(id);

// ── State ──────────────────────────────────────────────────────────
let device = null, char = null;
let connected = false;
let sessionDistanceM = 0;
let lastT = null;
let latestSpeed_kmh = 0;
let latestCadence_rpm = 0;

// ── Speech ─────────────────────────────────────────────────────────
function speak(text) {
  if (!text) return;
  const r = $("spoken");
  r.textContent = "";
  requestAnimationFrame(() => { r.textContent = text; });
}
function setStatus(t) { $("status").textContent = t; }

// ── RPM band ───────────────────────────────────────────────────────
let lastBand = null;
function updateRpm(cadenceRpm) {
  latestCadence_rpm = cadenceRpm;
  const band = Math.round(cadenceRpm / 5) * 5;
  $("rpm-value").textContent = band;
  if (band !== lastBand) {
    lastBand = band;
    speak(`${band}`);
  }
}

// ── Distance storage ───────────────────────────────────────────────
// Stored as array of {date:"YYYY-MM-DD", km:X} in localStorage key "cyclone-sessions"
function loadSessions() {
  try {
    const raw = localStorage.getItem("cyclone-sessions");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}
function saveSessions(sessions) {
  localStorage.setItem("cyclone-sessions", JSON.stringify(sessions));
}
function todayStr() {
  return new Date().toISOString().slice(0, 10); // "YYYY-MM-DD"
}
function weekStart(dateStr) {
  // ISO week: Monday start
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay(); // 0=Sun,1=Mon,...
  const diff = (day === 0 ? -6 : 1 - day);
  const mon = new Date(d);
  mon.setDate(d.getDate() + diff);
  return mon.toISOString().slice(0, 10);
}
function monthOf(dateStr) { return dateStr.slice(0, 7); } // "YYYY-MM"

function recordSession(km) {
  if (km <= 0) return;
  const sessions = loadSessions();
  sessions.push({ date: todayStr(), km: parseFloat(km.toFixed(3)) });
  saveSessions(sessions);
}

function computeStats() {
  const sessions = loadSessions();
  const today = todayStr();
  const thisWeekStart = weekStart(today);
  const thisMonth = monthOf(today);
  let todayKm = 0, weekKm = 0, monthKm = 0, allKm = 0;
  for (const s of sessions) {
    allKm += s.km;
    if (s.date === today) todayKm += s.km;
    if (s.date >= thisWeekStart) weekKm += s.km;
    if (monthOf(s.date) === thisMonth) monthKm += s.km;
  }
  return { todayKm, weekKm, monthKm, allKm };
}

function renderStats() {
  const { todayKm, weekKm, monthKm, allKm } = computeStats();
  $("stat-today").textContent   = `${todayKm.toFixed(2)} km`;
  $("stat-week").textContent    = `${weekKm.toFixed(2)} km`;
  $("stat-month").textContent   = `${monthKm.toFixed(2)} km`;
  $("stat-alltime").textContent = `${allKm.toFixed(2)} km`;
}

// ── Bluetooth parsing ──────────────────────────────────────────────
function parseBike(dv) {
  const flags = dv.getUint16(0, true); let o = 2; const out = {};
  const u16 = () => { const v = dv.getUint16(o, true); o += 2; return v; };
  const s16 = () => { const v = dv.getInt16(o, true); o += 2; return v; };
  const u24 = () => { const a = dv.getUint8(o), b = dv.getUint8(o+1), c = dv.getUint8(o+2); o += 3; return a|(b<<8)|(c<<16); };
  const u8  = () => { const v = dv.getUint8(o); o += 1; return v; };
  if (!(flags & 1))  out.speed_kmh    = u16() / 100; else;
  if (flags & 2)     u16();
  if (flags & 4)     out.cadence_rpm  = u16() / 2;
  if (flags & 8)     u16();
  if (flags & 16)    out.distance_m   = u24();
  if (flags & 32)    s16();
  if (flags & 64)    out.power_w      = s16();
  if (flags & 128)   s16();
  if (flags & 256)   u16(); // energy
  if (flags & 512)   u8();  // heart rate
  return out;
}

function onData(e) {
  const m = parseBike(e.target.value);
  const now = performance.now() / 1000;
  if ("speed_kmh" in m) latestSpeed_kmh = m.speed_kmh;
  if ("cadence_rpm" in m) updateRpm(m.cadence_rpm);

  // Dead-reckon distance from speed
  if ("distance_m" in m) {
    sessionDistanceM = m.distance_m;
  } else {
    const dt = lastT === null ? 0 : (now - lastT);
    if (dt > 0 && dt < 5) sessionDistanceM += (latestSpeed_kmh * 1000 / 3600) * dt;
  }
  lastT = now;
}

// ── Connect / disconnect ───────────────────────────────────────────
function setConnectedUI() {
  connected = true;
  const btn = $("main-btn");
  btn.textContent = "Stop";
  btn.classList.add("stop-mode");
  btn.disabled = false;
  $("rpm-display").hidden = false;
  lastBand = null;
  $("rpm-value").textContent = "0";
}

function setDisconnectedUI() {
  connected = false;
  const btn = $("main-btn");
  btn.textContent = "Connect";
  btn.classList.remove("stop-mode");
  btn.disabled = false;
  $("rpm-display").hidden = true;
}

function endSession() {
  const km = sessionDistanceM / 1000;
  recordSession(km);
  renderStats();
  speak(`Today: ${km.toFixed(2)} kilometres`);
}

async function connect() {
  if (!navigator.bluetooth) {
    $("unsupported").hidden = false;
    setStatus("No Bluetooth in this browser. Open in WebBLE.");
    return;
  }
  try {
    $("main-btn").disabled = true;
    setStatus("Opening chooser. Start pedalling, then pick your machine.");
    const savedName = localStorage.getItem("cyclone-device-name");
    const filters = savedName
      ? [{ name: savedName }, { services: [FTMS] }, { namePrefix: "Sport01" }]
      : [{ services: [FTMS] }, { namePrefix: "Sport01" }];
    device = await navigator.bluetooth.requestDevice({ filters, optionalServices: [FTMS] });
    localStorage.setItem("cyclone-device-name", device.name || "");
    device.addEventListener("gattserverdisconnected", onUnexpectedDisconnect);
    setStatus(`Connecting to ${device.name || "machine"}...`);
    const server = await device.gatt.connect();
    const svc    = await server.getPrimaryService(FTMS);
    char         = await svc.getCharacteristic(IBD);
    await char.startNotifications();
    char.addEventListener("characteristicvaluechanged", onData);
    sessionDistanceM = 0;
    lastT = null;
    latestSpeed_kmh = 0;
    setStatus(`Connected to ${device.name || "machine"}.`);
    setConnectedUI();
  } catch (err) {
    $("main-btn").disabled = false;
    const name = err && err.name ? err.name : "";
    const msg  = err && err.message ? err.message : String(err);
    if (name === "NotFoundError") setStatus("No machine selected. Make sure you are pedalling, then try again.");
    else if (name === "SecurityError") setStatus("Blocked by browser security. Open over https.");
    else setStatus(`Could not connect: ${msg}`);
  }
}

function stop() {
  if (device && device.gatt && device.gatt.connected) {
    device.removeEventListener("gattserverdisconnected", onUnexpectedDisconnect);
    device.gatt.disconnect();
  }
  device = null; char = null;
  endSession();
  setStatus("Session ended. Tap Connect when ready to ride again.");
  setDisconnectedUI();
}

function onUnexpectedDisconnect() {
  endSession();
  setStatus("Disconnected unexpectedly. Tap Connect to reconnect.");
  setDisconnectedUI();
}

// ── Reset ──────────────────────────────────────────────────────────
function resetData() {
  localStorage.removeItem("cyclone-sessions");
  renderStats();
  speak("All distance data cleared.");
}

// ── Init ───────────────────────────────────────────────────────────
$("main-btn").addEventListener("click", () => {
  if (connected) stop();
  else connect();
});
$("reset-btn").addEventListener("click", resetData);

if (!navigator.bluetooth) $("unsupported").hidden = false;
renderStats();
</script>
</body>
</html>
