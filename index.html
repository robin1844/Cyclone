<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Cyclone</title>
<style>
  :root {
    --bg: #f4f6f9;
    --fg: #111827;
    --accent: #1d4ed8;
    --accent-fg: #ffffff;
    --second: #111827;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #05080d;
      --fg: #f3f4f6;
      --accent: #60a5fa;
      --accent-fg: #07111f;
      --second: #161b22;
    }
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body { background: var(--bg); }
  #launcher {
    display: grid;
    grid-template-rows: 1fr 1fr;
    width: 100%;
    min-height: 100%;
  }
  button {
    width: 100%;
    min-height: 50vh;
    border: 0;
    border-radius: 0;
    background: var(--accent);
    color: var(--accent-fg);
    font: 900 clamp(2.5rem, 12vw, 6rem)/1 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    cursor: pointer;
  }
  button:last-child { background: var(--second); color: var(--fg); }
  button:focus-visible { outline: .35rem solid #f0b429; outline-offset: -.35rem; }
</style>
</head>
<body>
<div id="launcher">
  <button type="button" onclick="location.href='cyclone/'">Cyclone</button>
  <button type="button" onclick="location.href='typhoon/'">Typhoon</button>
</div>
</body>
</html>
